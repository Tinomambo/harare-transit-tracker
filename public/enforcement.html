<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City of Harare - Traffic Enforcement Portal</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #1e293b;
            border: 1px solid #0284c7;
            border-radius: 12px;
            padding: 35px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .badge {
            display: inline-block;
            background: rgba(2, 132, 199, 0.2);
            color: #38bdf8;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 15px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        h2 { margin: 0 0 5px 0; font-size: 1.6rem; color: #ffffff; text-align: center; }
        .subtitle { color: #94a3b8; font-size: 0.88rem; text-align: center; margin-bottom: 25px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 12px 15px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #38bdf8; }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover { background: #0369a1; }

        #messageBox {
            margin-top: 18px;
            text-align: center;
            font-size: 0.88rem;
            font-weight: 500;
            min-height: 20px;
        }

        /* Dashboard Container Hidden by Default */
        #dashboardContent {
            display: none;
            width: 100%;
            max-width: 800px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 25px;
        }
    </style>
</head>
<body>

    <!-- LOGIN CONTAINER -->
    <div id="loginContainer" class="login-card">
        <div style="text-align: center;"><span class="badge">Field Verification</span></div>
        <h2>Municipal Officer Login</h2>
        <div class="subtitle">Traffic Enforcement Operations</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Officer ID / Username</label>
                <input type="text" id="username" placeholder="officer" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit">Access Verification Portal</button>
        </form>

        <div id="messageBox"></div>
    </div>

    <!-- DASHBOARD CONTAINER -->
    <div id="dashboardContent">
        <h2 style="text-align: left; color: #38bdf8;">Enforcement Dashboard</h2>
        <p style="color: #94a3b8;">Active field inspection and fleet verification terminal.</p>
        <hr style="border-color: #334155; margin: 20px 0;">
        <p style="color: #4ade80;">Authenticated successfully. Enforcement status active.</p>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const messageBox = document.getElementById('messageBox');
        const loginContainer = document.getElementById('loginContainer');
        const dashboardContent = document.getElementById('dashboardContent');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            messageBox.style.color = '#cbd5e1';
            messageBox.innerText = 'Authenticating...';

            try {
                const response = await fetch('/api/enforcement/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    loginContainer.style.display = 'none';
                    dashboardContent.style.display = 'block';
                } else {
                    messageBox.style.color = '#f87171';
                    messageBox.innerText = data.message || 'Invalid enforcement credentials.';
                }
            } catch (err) {
                console.error('Login error:', err);
                messageBox.style.color = '#f87171';
                messageBox.innerText = 'Connection error. Check server status.';
            }
        });
    </script>
</body>
</html>
