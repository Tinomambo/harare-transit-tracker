<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Municipal Officer Field Verification - Harare Transit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b1329; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .card { background-color: #172a45; padding: 35px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); width: 100%; max-width: 550px; text-align: center; border: 1px solid #273e63; }
    .badge { display: inline-block; padding: 4px 12px; background-color: #0284c722; border: 1px solid #38bdf8; color: #38bdf8; border-radius: 20px; font-size: 11px; font-weight: bold; letter-spacing: 1px; margin-bottom: 12px; text-transform: uppercase; }
    h2 { color: #ffffff; font-size: 22px; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 25px; }
    .form-group { text-align: left; margin-bottom: 18px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #273e63; border-radius: 6px; background-color: #0b1329; color: #fff; font-size: 15px; box-sizing: border-box; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #0284c7; }
    button { width: 100%; padding: 12px; background-color: #0284c7; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background-color 0.2s ease; }
    button:hover { background-color: #0369a1; }
    #verificationSection { display: none; }
    .result-card { margin-top: 20px; padding: 18px; border-radius: 8px; text-align: left; display: none; }
    .result-valid { background-color: #065f4633; border: 1px solid #10b981; color: #a7f3d0; }
    .result-invalid { background-color: #7f1d1d33; border: 1px solid #ef4444; color: #fecaca; }
    .action-panel { margin-top: 20px; border-top: 2px dashed #273e63; padding-top: 20px; text-align: left; display: none; }
    .alert { padding: 12px; border-radius: 6px; margin-top: 15px; display: none; font-size: 14px; }
    .alert-error { background-color: #7f1d1d; color: #fecaca; }
  </style>
</head>
<body>

  <!-- 1. OFFICER LOGIN SCREEN -->
  <div id="loginSection" class="card">
    <div class="badge">Field Verification</div>
    <h2>Municipal Officer Login</h2>
    <div class="subtitle">Traffic Enforcement Operations</div>

    <form id="officerLoginForm">
      <div class="form-group">
        <label for="username">Officer ID / Username</label>
        <input type="text" id="username" placeholder="e.g. officer" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit">Access Verification Portal</button>
    </form>
    <div id="loginAlert" class="alert alert-error"></div>
  </div>

  <!-- 2. FIELD VERIFICATION & ENFORCEMENT TERMINAL -->
  <div id="verificationSection" class="card">
    <div class="badge">City of Harare</div>
    <h2>Vehicle Compliance Scanner</h2>
    <div class="subtitle">Enter license plate to verify registration and enforce compliance</div>

    <form id="verifyForm">
      <div class="form-group">
        <label for="registration_number">Target License Plate *</label>
        <input type="text" id="registration_number" placeholder="e.g. ABC-2006" maxlength="8" required />
      </div>

      <div class="form-group">
        <label for="checkpointName">Checkpoint Location</label>
        <select id="checkpointName">
          <option value="Fourth Street Rank">Fourth Street Rank</option>
          <option value="Copacabana Bus Station">Copacabana Bus Station</option>
          <option value="Rezende Street Rank">Rezende Street Rank</option>
          <option value="Harare Checkpoint">General Harare Checkpoint</option>
        </select>
      </div>

      <button type="submit">Query Vehicle & Inspect</button>
    </form>

    <!-- Verification & Inspection Result Output -->
    <div id="resultBox" class="result-card"></div>
    <div id="successBanner" class="alert" style="background-color: #065f46; color: #a7f3d0; margin-top: 15px; display: none;"></div>

    <button onclick="logout()" style="background-color: #334155; margin-top: 20px;">Logout Officer</button>
  </div>

  <script>
    const loginForm = document.getElementById('officerLoginForm');
    const verifyForm = document.getElementById('verifyForm');
    const loginAlert = document.getElementById('loginAlert');
    const resultBox = document.getElementById('resultBox');
    const successBanner = document.getElementById('successBanner');
    const regInput = document.getElementById('registration_number');

    regInput.addEventListener('input', (e) => e.target.value = e.target.value.toUpperCase());

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginAlert.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const response = await fetch('/api/officer/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await response.json();

        if (response.ok && data.success) {
          document.getElementById('loginSection').style.display = 'none';
          document.getElementById('verificationSection').style.display = 'block';
        } else {
          loginAlert.textContent = data.error || 'Invalid Officer Credentials.';
          loginAlert.style.display = 'block';
        }
      } catch (err) {
        loginAlert.textContent = 'Connection error. Check server status.';
        loginAlert.style.display = 'block';
      }
    });

    // Automatically verify vehicle and record inspection log on submit
    verifyForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultBox.style.display = 'none';
      successBanner.style.display = 'none';

      const registration_number = regInput.value.trim().toUpperCase();
      const checkpoint_name = document.getElementById('checkpointName').value;

      try {
        // 1. Verify vehicle against database
        const verifyRes = await fetch('/api/officer/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ registration_number })
        });
        const verifyData = await verifyRes.json();

        if (!verifyData.success) {
          alert('Verification failed.');
          return;
        }

        const isRegistered = verifyData.verified === true;
        const vehicleId = isRegistered ? verifyData.vehicle.id : null;
        
        // Rules: Registered vehicles are CLEARED ($0.00), unregistered vehicles are FINED ($30.00)
        const actionTaken = isRegistered ? 'CLEARED' : 'FINED';
        const fineAmount = isRegistered ? 0.00 : 30.00;

        // 2. Automatically log enforcement inspection to database so it populates Reports page
        const inspectPayload = {
          officer_id: 'OFFICER_HARARE_01',
          vehicle_id: vehicleId,
          vehicle_plate: registration_number,
          is_registered: isRegistered,
          checkpoint_name: checkpoint_name,
          action_taken: actionTaken,
          fine_amount: fineAmount,
          notes: isRegistered ? 'Routine verification - Compliant' : 'Unregistered commercial vehicle spot fine'
        };

        const inspectRes = await fetch('/api/officer/inspect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(inspectPayload)
        });
        const inspectData = await inspectRes.json();

        if (inspectData.success) {
          if (isRegistered) {
            resultBox.className = 'result-card result-valid';
            resultBox.innerHTML = `
              <div style="font-weight: bold; font-size: 15px; margin-bottom: 8px;">✓ COMPLIANT / REGISTERED VEHICLE</div>
              <div>Vehicle Plate: <strong>${registration_number}</strong></div>
              <div>Status: <strong style="color: #34d399;">REGISTERED</strong></div>
              <div>Checkpoint: <strong>${checkpoint_name}</strong></div>
              <div>Enforcement Action: <strong>CLEARED ($0.00)</strong></div>
            `;
          } else {
            resultBox.className = 'result-card result-invalid';
            resultBox.innerHTML = `
              <div style="font-weight: bold; font-size: 15px; margin-bottom: 8px;">✕ UNREGISTERED / OFFENDING VEHICLE</div>
              <div>Vehicle Plate: <strong>${registration_number}</strong></div>
              <div>Status: <strong style="color: #fca5a5;">UNREGISTERED</strong></div>
              <div>Checkpoint: <strong>${checkpoint_name}</strong></div>
              <div>Enforcement Action: <strong style="color: #ef4444;">FINED $30.00</strong></div>
            `;
          }

          resultBox.style.display = 'block';
          successBanner.textContent = '✓ Inspection successfully logged and synced to Weekly/Monthly Reports!';
          successBanner.style.display = 'block';
        } else {
          alert('Error logging inspection: ' + inspectData.error);
        }

      } catch (err) {
        console.error('Verification error:', err);
        alert('Server communication error during verification.');
      }
    });

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
