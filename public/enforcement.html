<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City of Harare - Traffic Enforcement Portal</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #1e293b;
            border: 1px solid #0284c7;
            border-radius: 12px;
            padding: 35px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .badge {
            display: inline-block;
            background: rgba(2, 132, 199, 0.2);
            color: #38bdf8;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 15px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        h2 { margin: 0 0 5px 0; font-size: 1.6rem; color: #ffffff; text-align: center; }
        .subtitle { color: #94a3b8; font-size: 0.88rem; text-align: center; margin-bottom: 25px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 12px 15px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #38bdf8; }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover { background: #0369a1; }

        #messageBox {
            margin-top: 18px;
            text-align: center;
            font-size: 0.88rem;
            font-weight: 500;
            min-height: 20px;
        }

        /* DASHBOARD INTERFACE */
        #dashboardContent {
            display: none;
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 25px;
        }

        .search-box input {
            flex: 1;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .search-box button {
            padding: 12px 24px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-box button:hover { background: #0369a1; }

        .result-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            display: none;
        }

        .status-pill {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .status-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
        .status-inactive { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1e293b;
            font-size: 0.9rem;
        }
        .data-row:last-child { border-bottom: none; }
        .data-label { color: #94a3b8; }
        .data-value { color: #ffffff; font-weight: 600; }
    </style>
</head>
<body>

    <!-- LOGIN CONTAINER -->
    <div id="loginContainer" class="login-card">
        <div style="text-align: center;"><span class="badge">Field Verification</span></div>
        <h2>Municipal Officer Login</h2>
        <div class="subtitle">Traffic Enforcement Operations</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Officer ID / Username</label>
                <input type="text" id="username" placeholder="officer" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit">Access Verification Portal</button>
        </form>

        <div id="messageBox"></div>
    </div>

    <!-- DASHBOARD CONTAINER -->
    <div id="dashboardContent">
        <h2 style="text-align: left; color: #38bdf8; margin: 0;">Vehicle Verification Terminal</h2>
        <p style="color: #94a3b8; margin-top: 5px; font-size: 0.9rem;">Verify license plates and live telemetry status within CBD zones.</p>
        
        <div class="search-box">
            <input type="text" id="plateSearch" placeholder="e.g. AAE 1234" autocomplete="off">
            <button type="button" id="btnVerify">Verify Plate</button>
        </div>

        <div id="resultCard" class="result-card">
            <div id="statusBadge" class="status-pill"></div>
            <div class="data-row">
                <span class="data-label">Target Plate:</span>
                <span id="resPlate" class="data-value">---</span>
            </div>
            <div class="data-row">
                <span class="data-label">Telemetry Status:</span>
                <span id="resTelemetry" class="data-value">---</span>
            </div>
            <div class="data-row">
                <span class="data-label">Current Speed:</span>
                <span id="resSpeed" class="data-value">---</span>
            </div>
            <div class="data-row">
                <span class="data-label">Coordinates:</span>
                <span id="resCoords" class="data-value">---</span>
            </div>
            <div class="data-row">
                <span class="data-label">Last Transmission:</span>
                <span id="resTime" class="data-value">---</span>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const messageBox = document.getElementById('messageBox');
        const loginContainer = document.getElementById('loginContainer');
        const dashboardContent = document.getElementById('dashboardContent');

        const plateSearch = document.getElementById('plateSearch');
        const btnVerify = document.getElementById('btnVerify');
        const resultCard = document.getElementById('resultCard');

        let activeFleet = new Map();
        let ws = null;

        // Login Handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            messageBox.style.color = '#cbd5e1';
            messageBox.innerText = 'Authenticating...';

            try {
                const response = await fetch('/api/enforcement/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    loginContainer.style.display = 'none';
                    dashboardContent.style.display = 'block';
                    initWebSocket();
                } else {
                    messageBox.style.color = '#f87171';
                    messageBox.innerText = data.message || 'Invalid enforcement credentials.';
                }
            } catch (err) {
                console.error('Login error:', err);
                messageBox.style.color = '#f87171';
                messageBox.innerText = 'Connection error. Check server status.';
            }
        });

        // Initialize WebSocket to receive real-time active fleet telemetry
        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'FLEET_UPDATE' && Array.isArray(data.vehicles)) {
                        activeFleet = new Map(data.vehicles);
                    }
                } catch (err) {
                    console.error('WebSocket parse error:', err);
                }
            };
        }

        // Verification Search Logic
        btnVerify.addEventListener('click', performVerification);
        plateSearch.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performVerification();
        });

        function performVerification() {
            const query = plateSearch.value.trim().toUpperCase();
            if (!query) return;

            resultCard.style.display = 'block';

            const activeData = activeFleet.get(query);

            document.getElementById('resPlate').innerText = query;

            if (activeData) {
                document.getElementById('statusBadge').className = 'status-pill status-active';
                document.getElementById('statusBadge').innerText = '● ACTIVE TELEMETRY STREAM';
                document.getElementById('resTelemetry').innerText = 'Broadcasting Live GPS';
                document.getElementById('resSpeed').innerText = `${Math.round(activeData.speed || 0)} km/h`;
                document.getElementById('resCoords').innerText = `${activeData.lat.toFixed(5)}, ${activeData.lng.toFixed(5)}`;
                
                const lastTime = new Date(activeData.timestamp).toLocaleTimeString();
                document.getElementById('resTime').innerText = lastTime;
            } else {
                document.getElementById('statusBadge').className = 'status-pill status-inactive';
                document.getElementById('statusBadge').innerText = '▲ OFF-LINE / NO TELEMETRY';
                document.getElementById('resTelemetry').innerText = 'No Active Signal';
                document.getElementById('resSpeed').innerText = 'N/A';
                document.getElementById('resCoords').innerText = 'N/A';
                document.getElementById('resTime').innerText = 'No active transmission';
            }
        }
    </script>
</body>
</html>
