<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Telemetry Terminal - City of Harare</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 25px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 1rem; outline: none; }
        .btn-primary { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .btn-primary:hover { background: #0369a1; }
        .status-box { margin-top: 20px; padding: 15px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; font-size: 0.9rem; text-align: left; }
        .live-indicator { display: inline-block; width: 10px; height: 10px; background-color: #ef4444; border-radius: 50%; margin-right: 6px; }
        .live-active { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="color: #38bdf8; margin-top: 0;">Driver Telemetry Terminal</h2>
        <p style="color: #94a3b8; font-size: 0.85rem;">Harare Public Transport Live Location Stream</p>

        <form id="driverForm">
            <div class="form-group">
                <label for="plateInput">Vehicle License Plate</label>
                <input type="text" id="plateInput" placeholder="e.g. ASD-1234" required>
            </div>
            <div class="form-group">
                <label for="pinInput">Access PIN</label>
                <input type="password" id="pinInput" placeholder="4-digit PIN" required>
            </div>
            <button type="submit" class="btn-primary">Start Live Transmission</button>
        </form>

        <div id="driverMsg" style="margin-top: 15px; font-size: 0.88rem; font-weight: bold;"></div>

        <div id="telemetryStatus" class="status-box" style="display: none;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                <span style="font-weight: bold; color: #38bdf8;">Transmission Status</span>
                <span><span id="dotIndicator" class="live-indicator"></span><span id="statusLabel" style="font-size: 0.8rem; font-weight: bold;">OFFLINE</span></span>
            </div>
            <div style="color: #94a3b8; font-size: 0.85rem;">
                Vehicle: <span id="activePlate" style="color: #fff; font-weight: bold;">-</span><br>
                Latitude: <span id="latVal" style="color: #fff;">0.0000</span><br>
                Longitude: <span id="lngVal" style="color: #fff;">0.0000</span><br>
                Speed: <span id="speedVal" style="color: #fff;">0 km/h</span>
            </div>
        </div>
    </div>

    <script>
        const driverForm = document.getElementById('driverForm');
        const driverMsg = document.getElementById('driverMsg');
        const telemetryStatus = document.getElementById('telemetryStatus');
        const dotIndicator = document.getElementById('dotIndicator');
        const statusLabel = document.getElementById('statusLabel');
        const activePlate = document.getElementById('activePlate');
        const latVal = document.getElementById('latVal');
        const lngVal = document.getElementById('lngVal');
        const speedVal = document.getElementById('speedVal');

        let ws;
        let watchId = null;
        let currentPlate = '';

        driverForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const plate = document.getElementById('plateInput').value.trim().toUpperCase();
            const pin = document.getElementById('pinInput').value.trim();

            driverMsg.style.color = '#cbd5e1';
            driverMsg.innerText = 'Authenticating vehicle...';

            try {
                const res = await fetch('/api/driver/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ plate, pin })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    driverMsg.style.color = '#4ade80';
                    driverMsg.innerText = 'Authenticated! Requesting location access...';
                    currentPlate = plate;
                    driverForm.style.display = 'none';
                    telemetryStatus.style.display = 'block';
                    activePlate.innerText = currentPlate;

                    initWebSocketAndGPS();
                } else {
                    driverMsg.style.color = '#f87171';
                    driverMsg.innerText = data.message || 'Invalid Plate or Access PIN.';
                }
            } catch (err) {
                console.error(err);
                driverMsg.style.color = '#f87171';
                driverMsg.innerText = 'Connection error. Check server status.';
            }
        });

        function initWebSocketAndGPS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                dotIndicator.classList.add('live-active');
                statusLabel.innerText = 'BROADCASTING';
                statusLabel.style.color = '#4ade80';
                startGPSTracking();
            };

            ws.onclose = () => {
                dotIndicator.classList.remove('live-active');
                statusLabel.innerText = 'DISCONNECTED';
                statusLabel.style.color = '#ef4444';
            };
        }

        function startGPSTracking() {
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser.');
                return;
            }

            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const speed = pos.coords.speed ? (pos.coords.speed * 3.6) : 0; // m/s to km/h

                    latVal.innerText = lat.toFixed(5);
                    lngVal.innerText = lng.toFixed(5);
                    speedVal.innerText = `${Math.round(speed)} km/h`;

                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'TELEMETRY_UPDATE',
                            plate: currentPlate,
                            lat: lat,
                            lng: lng,
                            speed: speed
                        }));
                    }
                },
                (err) => {
                    console.error('GPS Watch Error:', err);
                    alert('Please allow Location Permissions on your phone to transmit telemetry.');
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 5000
                }
            );
        }
    </script>
</body>
</html>
