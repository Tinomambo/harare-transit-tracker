<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Telemetry Terminal - Harare Transit Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b1329;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .terminal-card {
      background-color: #172a45;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h2 {
      color: #38bdf8;
      font-size: 22px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #273e63;
      border-radius: 6px;
      background-color: #0b1329;
      color: #fff;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #0284c7;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #0369a1;
    }

    .status-panel {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background-color: #0f172a;
      border: 1px solid #0284c7;
      text-align: left;
    }

    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      background-color: #10b981;
      border-radius: 50%;
      margin-right: 8px;
    }

    .alert {
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      display: none;
      font-size: 14px;
      font-weight: 500;
    }

    .alert-error {
      background-color: #7f1d1d;
      color: #fecaca;
    }

    .alert-success {
      background-color: #065f46;
      color: #a7f3d0;
    }
  </style>
</head>
<body>

  <div class="terminal-card">
    <h2>Driver Telemetry Terminal</h2>
    <div class="subtitle">Harare Public Transport Live Location Stream</div>

    <form id="driverLoginForm">
      <div class="form-group">
        <label for="registration_number">Vehicle License Plate</label>
        <input 
          type="text" 
          id="registration_number" 
          placeholder="e.g. AQW-1356" 
          maxlength="8" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="pin">Access PIN</label>
        <input 
          type="password" 
          id="pin" 
          placeholder="••••" 
          maxlength="4" 
          required 
        />
      </div>

      <button type="submit" id="submitBtn">Start Live Transmission</button>
    </form>

    <div id="alertBox" class="alert"></div>

    <!-- Active Stream Dashboard -->
    <div id="statusPanel" class="status-panel">
      <div style="font-size: 14px; font-weight: bold; margin-bottom: 8px;">
        <span class="status-indicator"></span> Transmitting GPS Stream
      </div>
      <div style="font-size: 12px; color: #94a3b8;">Vehicle: <strong id="activeReg" style="color: #38bdf8;"></strong></div>
      <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">Lat/Lng: <span id="gpsCoords" style="color: #a7f3d0;">Acquiring GPS...</span></div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('driverLoginForm');
    const alertBox = document.getElementById('alertBox');
    const statusPanel = document.getElementById('statusPanel');
    const regInput = document.getElementById('registration_number');
    let watchId = null;

    // Auto-uppercase vehicle registration input
    regInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.toUpperCase();
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const registration_number = regInput.value.trim();
      const pin = document.getElementById('pin').value.trim();

      try {
        const response = await fetch('/api/driver/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ registration_number, pin })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showAlert('Authentication successful! Starting GPS stream...', 'success');
          loginForm.style.display = 'none';
          statusPanel.style.display = 'block';
          document.getElementById('activeReg').textContent = registration_number;

          // Start Geolocation Telemetry Watch
          startGpsTracking(registration_number);
        } else {
          showAlert(data.error || 'Invalid vehicle registration or access PIN.', 'error');
        }
      } catch (err) {
        console.error('Connection error:', err);
        showAlert('Connection error. Check server status.', 'error');
      }
    });

    function startGpsTracking(vehicleReg) {
      if ('geolocation' in navigator) {
        watchId = navigator.geolocation.watchPosition(
          (position) => {
            const lat = position.coords.latitude.toFixed(6);
            const lng = position.coords.longitude.toFixed(6);
            
            document.getElementById('gpsCoords').textContent = `${lat}, ${lng}`;

            // Transmit GPS coordinates via WebSocket or HTTP telemetry endpoint
            console.log(`[GPS TRANSMISSION] ${vehicleReg} -> Lat: ${lat}, Lng: ${lng}`);
          },
          (error) => {
            console.warn('Geolocation Error:', error.message);
            document.getElementById('gpsCoords').textContent = 'GPS Signal Searching...';
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );
      } else {
        document.getElementById('gpsCoords').textContent = 'Geolocation not supported by device.';
      }
    }

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className = `alert alert-${type}`;
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
