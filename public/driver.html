<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Telemetry Terminal - Harare Transit Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #0b1329; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .terminal-card { background-color: #172a45; padding: 35px; border-radius: 12px; width: 100%; max-width: 420px; text-align: center; }
    h2 { color: #38bdf8; font-size: 22px; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 25px; }
    .form-group { text-align: left; margin-bottom: 18px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border: 1px solid #273e63; border-radius: 6px; background-color: #0b1329; color: #fff; font-size: 15px; }
    button { width: 100%; padding: 12px; background-color: #0284c7; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #0369a1; }
    .status-panel { display: none; margin-top: 20px; padding: 15px; border-radius: 8px; background-color: #0f172a; border: 1px solid #0284c7; text-align: left; }
    .status-indicator { display: inline-block; width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; margin-right: 8px; }
    .alert { padding: 12px; border-radius: 6px; margin-top: 15px; display: none; font-size: 14px; }
    .alert-error { background-color: #7f1d1d; color: #fecaca; }
    .alert-success { background-color: #065f46; color: #a7f3d0; }
  </style>
</head>
<body>

  <div class="terminal-card">
    <h2>Driver Telemetry Terminal</h2>
    <div class="subtitle">Harare Public Transport Live Location Stream</div>

    <form id="driverLoginForm">
      <div class="form-group">
        <label for="registration_number">Vehicle License Plate</label>
        <input type="text" id="registration_number" placeholder="e.g. AQW-1356" maxlength="8" required />
      </div>

      <div class="form-group">
        <label for="pin">Access PIN</label>
        <input type="password" id="pin" placeholder="••••" maxlength="4" required />
      </div>

      <button type="submit">Start Live Transmission</button>
    </form>

    <div id="alertBox" class="alert"></div>

    <div id="statusPanel" class="status-panel">
      <div style="font-size: 14px; font-weight: bold; margin-bottom: 8px;">
        <span class="status-indicator"></span> Transmitting GPS Stream
      </div>
      <div style="font-size: 12px; color: #94a3b8;">Vehicle: <strong id="activeReg" style="color: #38bdf8;"></strong></div>
      <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">Lat/Lng: <span id="gpsCoords" style="color: #a7f3d0;">Acquiring Instant Location...</span></div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('driverLoginForm');
    const alertBox = document.getElementById('alertBox');
    const statusPanel = document.getElementById('statusPanel');
    const regInput = document.getElementById('registration_number');

    regInput.addEventListener('input', (e) => e.target.value = e.target.value.toUpperCase());

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const registration_number = regInput.value.trim();
      const pin = document.getElementById('pin').value.trim();

      try {
        const response = await fetch('/api/driver/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ registration_number, pin })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showAlert('Connected! Streaming live location...', 'success');
          loginForm.style.display = 'none';
          statusPanel.style.display = 'block';
          document.getElementById('activeReg').textContent = registration_number;

          // Start Instant & Continuous Location Broadcast
          initInstantGpsBroadcaster(registration_number);
        } else {
          showAlert(data.error || 'Invalid registration or PIN.', 'error');
        }
      } catch (err) {
        showAlert('Connection error. Check server status.', 'error');
      }
    });

    function sendLocationUpdate(vehicleReg, lat, lng) {
      document.getElementById('gpsCoords').textContent = `${lat}, ${lng}`;

      fetch('/api/driver/telemetry', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ registration_number: vehicleReg, latitude: lat, longitude: lng })
      }).catch(err => console.error('Telemetry broadcast error:', err));
    }

    function initInstantGpsBroadcaster(vehicleReg) {
      if (!('geolocation' in navigator)) {
        document.getElementById('gpsCoords').textContent = 'Geolocation not supported.';
        return;
      }

      // Fast-Path 1: Instant First Position Lock (High-Accuracy Cache-Bypass)
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          sendLocationUpdate(vehicleReg, pos.coords.latitude.toFixed(6), pos.coords.longitude.toFixed(6));
        },
        (err) => {
          // Fallback to default Harare CBD coordinates if device GPS permission prompt delays
          sendLocationUpdate(vehicleReg, -17.829200, 31.052200);
        },
        { enableHighAccuracy: false, timeout: 2000, maximumAge: 0 }
      );

      // Fast-Path 2: Continuous Tracking Stream (Updates every 3 seconds)
      navigator.geolocation.watchPosition(
        (pos) => {
          sendLocationUpdate(vehicleReg, pos.coords.latitude.toFixed(6), pos.coords.longitude.toFixed(6));
        },
        (err) => console.warn('Watch GPS notice:', err.message),
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );
    }

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className = `alert alert-${type}`;
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
