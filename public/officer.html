<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Municipal Officer Field Verification - Harare Transit</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b1329;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background-color: #172a45;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 500px;
      text-align: center;
      border: 1px solid #273e63;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      background-color: #0284c722;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    h2 {
      color: #ffffff;
      font-size: 22px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #273e63;
      border-radius: 6px;
      background-color: #0b1329;
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #0284c7;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #0369a1;
    }

    #verificationSection {
      display: none;
    }

    .result-card {
      margin-top: 20px;
      padding: 18px;
      border-radius: 8px;
      text-align: left;
      display: none;
    }

    .result-valid {
      background-color: #065f4633;
      border: 1px solid #10b981;
      color: #a7f3d0;
    }

    .result-invalid {
      background-color: #7f1d1d33;
      border: 1px solid #ef4444;
      color: #fecaca;
    }

    .action-panel {
      margin-top: 20px;
      border-top: 2px dashed #273e63;
      padding-top: 20px;
      text-align: left;
      display: none;
    }

    .alert {
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      display: none;
      font-size: 14px;
    }

    .alert-error {
      background-color: #7f1d1d;
      color: #fecaca;
    }
  </style>
</head>
<body>

  <!-- 1. OFFICER LOGIN SCREEN -->
  <div id="loginSection" class="card">
    <div class="badge">Field Verification</div>
    <h2>Municipal Officer Login</h2>
    <div class="subtitle">Traffic Enforcement Operations</div>

    <form id="officerLoginForm">
      <div class="form-group">
        <label for="username">Officer ID / Username</label>
        <input type="text" id="username" placeholder="e.g. officer" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>

      <button type="submit">Access Verification Portal</button>
    </form>

    <div id="loginAlert" class="alert alert-error"></div>
  </div>

  <!-- 2. FIELD VERIFICATION & ENFORCEMENT TERMINAL -->
  <div id="verificationSection" class="card">
    <div class="badge">City of Harare</div>
    <h2>Vehicle Compliance Scanner</h2>
    <div class="subtitle">Enter license plate to verify registration and enforce compliance</div>

    <form id="verifyForm">
      <div class="form-group">
        <label for="registration_number">Target License Plate</label>
        <input 
          type="text" 
          id="registration_number" 
          placeholder="e.g. ABC-2006" 
          maxlength="8" 
          required 
        />
      </div>

      <button type="submit">Verify Vehicle Status</button>
    </form>

    <!-- Verification Output Result -->
    <div id="resultBox" class="result-card"></div>

    <!-- Enforcement Action Panel -->
    <div id="actionPanel" class="action-panel">
      <h3 style="color: #38bdf8; font-size: 16px; margin-bottom: 12px;">Enforcement & Disciplinary Action</h3>
      
      <div class="form-group">
        <label for="checkpointName">Checkpoint Location</label>
        <input type="text" id="checkpointName" value="Fourth Street Rank">
      </div>

      <div class="form-group">
        <label for="actionTaken">Action Required</label>
        <select id="actionTaken" onchange="toggleFineInput()">
          <option value="CLEARED">Cleared / Valid (No Action)</option>
          <option value="FINED">Issue Spot Fine ($30)</option>
          <option value="IMPOUND_FLAGGED">Flag for Impoundment / Clamping</option>
          <option value="DRIVER_SUSPENDED">Suspend Driver Account & PIN</option>
        </select>
      </div>

      <div class="form-group" id="fineGroup" style="display:none;">
        <label for="fineAmount">Fine Amount ($)</label>
        <input type="number" id="fineAmount" value="0.00" step="0.01">
      </div>

      <div class="form-group">
        <label for="notes">Officer Notes / Reason</label>
        <textarea id="notes" placeholder="Enter details of infraction..." rows="2"></textarea>
      </div>

      <button onclick="submitEnforcementAction()" style="background-color: #ef4444;">Commit Enforcement Record</button>
    </div>

    <button onclick="logout()" style="background-color: #334155; margin-top: 20px;">Logout Officer</button>
  </div>

  <script>
    let currentVehicleData = null;

    const loginForm = document.getElementById('officerLoginForm');
    const verifyForm = document.getElementById('verifyForm');
    const loginAlert = document.getElementById('loginAlert');
    const resultBox = document.getElementById('resultBox');
    const actionPanel = document.getElementById('actionPanel');
    const regInput = document.getElementById('registration_number');

    regInput.addEventListener('input', (e) => e.target.value = e.target.value.toUpperCase());

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginAlert.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const response = await fetch('/api/officer/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          document.getElementById('loginSection').style.display = 'none';
          document.getElementById('verificationSection').style.display = 'block';
        } else {
          loginAlert.textContent = data.error || 'Invalid Officer Credentials.';
          loginAlert.style.display = 'block';
        }
      } catch (err) {
        loginAlert.textContent = 'Connection error. Check server status.';
        loginAlert.style.display = 'block';
      }
    });

    verifyForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultBox.style.display = 'none';
      actionPanel.style.display = 'none';

      const registration_number = regInput.value.trim();

      try {
        const response = await fetch('/api/officer/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ registration_number })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          if (data.verified) {
            currentVehicleData = data.vehicle;
            resultBox.className = 'result-card result-valid';
            resultBox.innerHTML = `
              <div style="font-weight: bold; font-size: 15px; margin-bottom: 6px;">✓ COMPLIANT VEHICLE</div>
              <div>Registration: <strong>${data.vehicle.registration_number}</strong></div>
              <div>Operational Status: <strong>${data.vehicle.operational_status || data.vehicle.status}</strong></div>
              <div>Live Transmission: <strong>${data.vehicle.is_live_transmitting ? 'ACTIVE' : 'OFFLINE'}</strong></div>
            `;
            
            // Registered vehicles default to CLEARED with $0.00 fine
            actionPanel.style.display = 'block';
            document.getElementById('actionTaken').value = 'CLEARED';
            document.getElementById('fineAmount').value = '0.00';
            toggleFineInput();
          } else {
            currentVehicleData = { id: null, registration_number: registration_number.toUpperCase() };
            resultBox.className = 'result-card result-invalid';
            resultBox.innerHTML = `
              <div style="font-weight: bold; font-size: 15px; margin-bottom: 6px;">✕ NON-COMPLIANT / UNREGISTERED</div>
              <div>${data.message}</div>
            `;

            // Unregistered vehicles default to FINED with $30.00 spot fine
            actionPanel.style.display = 'block';
            document.getElementById('actionTaken').value = 'FINED';
            document.getElementById('fineAmount').value = '30.00';
            toggleFineInput();
          }
          resultBox.style.display = 'block';
        } else {
          alert('Verification request failed.');
        }
      } catch (err) {
        alert('Server communication error.');
      }
    });

    function toggleFineInput() {
      const action = document.getElementById('actionTaken').value;
      const fineGroup = document.getElementById('fineGroup');
      if (action === 'FINED') {
        fineGroup.style.display = 'block';
      } else {
        fineGroup.style.display = 'none';
      }
    }

    async function submitEnforcementAction() {
      if (!currentVehicleData) return;

      const actionTakenVal = document.getElementById('actionTaken').value;
      const isRegistered = currentVehicleData.id !== null;

      const payload = {
        officer_id: 'OFFICER_HARARE_01',
        vehicle_id: currentVehicleData.id || null,
        vehicle_plate: currentVehicleData.registration_number,
        is_registered: isRegistered,
        checkpoint_name: document.getElementById('checkpointName').value,
        action_taken: actionTakenVal,
        fine_amount: (isRegistered && actionTakenVal !== 'FINED') ? 0.00 : (parseFloat(document.getElementById('fineAmount').value) || 0.00),
        notes: document.getElementById('notes').value
      };

      try {
        const response = await fetch('/api/officer/inspect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (result.success) {
          alert('Enforcement action successfully recorded and synced with the database.');
          location.reload();
        } else {
          alert('Error: ' + result.error);
        }
      } catch (error) {
        console.error('Submission error:', error);
        alert('Failed to submit enforcement action.');
      }
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
