<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harare Transit — Admin Operations Dashboard</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

  <!-- Admin Login Modal Barrier -->
  <div id="login-modal" class="fixed inset-0 bg-slate-950/95 z-[9999] flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
      <div class="text-center space-y-1">
        <span class="bg-amber-500/10 text-amber-400 text-[10px] font-bold px-2.5 py-0.5 rounded-full border border-amber-500/30 uppercase">
          🔒 Restrict Access
        </span>
        <h2 class="text-lg font-bold text-white mt-2">Administrator Login</h2>
        <p class="text-xs text-gray-400">City of Harare Central Operations</p>
      </div>

      <div>
        <label class="block text-xs text-gray-400 mb-1">Username</label>
        <input id="admin-user" type="text" value="admin" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-amber-500" />
      </div>

      <div>
        <label class="block text-xs text-gray-400 mb-1">Password</label>
        <input id="admin-pass" type="password" value="harare2026" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-amber-500" />
      </div>

      <button onclick="loginAdmin()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 rounded-xl text-xs transition">
        Authenticate Dashboard
      </button>
      <p id="admin-error" class="text-xs text-rose-400 text-center font-bold hidden"></p>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex justify-between items-center shadow-lg z-10">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-base font-bold text-white tracking-wide">City of Harare CBD Fleet Control</h1>
    </div>
    <div class="flex items-center gap-4 text-xs font-mono">
      <span class="text-slate-400">Active Fleet: <b id="fleet-count" class="text-emerald-400 text-sm">0</b> vehicles</span>
      <button onclick="location.reload()" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-gray-300 border border-slate-700">Lock Session</button>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- Map Container -->
    <div id="map" class="flex-1 h-full z-0"></div>

    <!-- Side Control Panel -->
    <aside class="w-80 bg-slate-900 border-l border-slate-800 p-4 flex flex-col gap-4 overflow-y-auto">
      
      <!-- Register Vehicle & Driver PIN -->
      <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
        <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider">➕ Register Vehicle & Driver PIN</h2>
        <div>
          <input id="reg-plate" type="text" placeholder="Plate (e.g. AEB-9021)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white uppercase mb-2 focus:outline-none focus:border-amber-500">
          <input id="reg-pin" type="text" maxlength="6" placeholder="Driver Access PIN (e.g. 1234)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white mb-2 focus:outline-none focus:border-amber-500">
          <button onclick="registerVehicle()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-1.5 rounded-lg text-xs transition">
            Save & Generate PIN
          </button>
        </div>
        <div id="reg-status" class="text-[11px] hidden"></div>
      </div>

      <!-- Active Fleet List -->
      <div class="flex-1 flex flex-col min-h-0">
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Live Fleet Telemetry</h2>
        <div id="vehicle-list" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs">
          <div class="text-gray-500 italic text-center py-4">Waiting for vehicle telemetry...</div>
        </div>
      </div>

    </aside>
  </div>

  <script>
    let map, socket;
    let markers = {};

    // Initialize Leaflet Map
    function initMap() {
      map = L.map('map').setView([-17.8315, 31.0425], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      // Add Terminal Rank Markers
      const ranks = [
        { name: 'Copacabana Rank', lat: -17.8315, lng: 31.0425 },
        { name: 'Fourth Street Rank', lat: -17.8319, lng: 31.0558 },
        { name: 'Market Square Rank', lat: -17.8358, lng: 31.0381 }
      ];

      ranks.forEach(r => {
        L.circle([r.lat, r.lng], { color: '#f59e0b', fillColor: '#f59e0b', fillOpacity: 0.15, radius: 150 }).addTo(map);
        L.marker([r.lat, r.lng]).addTo(map).bindPopup(`<b>${r.name}</b><br>Municipal Rank Zone`);
      });
    }

    async function loginAdmin() {
      const user = document.getElementById('admin-user').value;
      const pass = document.getElementById('admin-pass').value;
      const err = document.getElementById('admin-error');

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json();

        if (res.ok && data.role === 'admin') {
          document.getElementById('login-modal').classList.add('hidden');
          initMap();
          initSockets();
          fetchActiveFleet();
        } else {
          err.innerText = 'Unauthorized admin credentials.';
          err.classList.remove('hidden');
        }
      } catch (e) {
        err.innerText = 'Connection error.';
        err.classList.remove('hidden');
      }
    }

    async function registerVehicle() {
      const plate = document.getElementById('reg-plate').value.trim();
      const pin = document.getElementById('reg-pin').value.trim();
      const status = document.getElementById('reg-status');

      if (!plate || !pin) return;

      try {
        const res = await fetch('/api/v1/admin/register-vehicle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ registration_number: plate, pin, capacity: 18 })
        });
        const data = await res.json();

        status.classList.remove('hidden');
        if (res.ok) {
          status.className = 'text-[11px] text-emerald-400 font-bold';
          status.innerText = `Registered ${plate} (PIN: ${pin})`;
        } else {
          status.className = 'text-[11px] text-rose-400 font-bold';
          status.innerText = data.error || 'Failed to register';
        }
      } catch (e) {
        console.error(e);
      }
    }

    function initSockets() {
      socket = io();
      socket.on('location_update', (data) => {
        updateVehicleOnMap(data);
      });
    }

    async function fetchActiveFleet() {
      try {
        const res = await fetch('/api/v1/vehicles');
        const data = await res.json();
        data.vehicles.forEach(updateVehicleOnMap);
      } catch (e) { console.error(e); }
    }

    function updateVehicleOnMap(v) {
      document.getElementById('fleet-count').innerText = Object.keys(markers).length + 1;

      if (markers[v.registration_number]) {
        markers[v.registration_number].setLatLng([v.latitude, v.longitude]);
      } else {
        const marker = L.marker([v.latitude, v.longitude]).addTo(map)
          .bindPopup(`<b>${v.registration_number}</b><br>Speed: ${v.speed} km/h`);
        markers[v.registration_number] = marker;
      }
    }
  </script>
</body>
</html>
