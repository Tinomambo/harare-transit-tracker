<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City of Harare - Admin Operations Dashboard</title>

    <!-- Leaflet OpenStreetMap CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; margin: 0; padding: 20px; }
        
        /* Modal Overlay */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000;
        }
        .login-card {
            background: #1e293b; padding: 35px; border-radius: 12px;
            border: 1px solid #38bdf8; width: 100%; max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center;
        }
        .badge {
            background: rgba(234, 88, 12, 0.2); color: #ea580c;
            font-size: 0.75rem; font-weight: bold; padding: 4px 10px;
            border-radius: 12px; text-transform: uppercase; letter-spacing: 1px;
        }
        .login-card h2 { color: #ffffff; margin: 15px 0 5px 0; font-size: 1.5rem; }
        .login-card p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 5px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px; background: #0f172a;
            border: 1px solid #334155; color: #ffffff; border-radius: 6px;
            font-size: 0.95rem; outline: none; transition: border-color 0.2s;
        }
        input[readonly] { background: #1e293b; color: #94a3b8; cursor: not-allowed; }
        input:focus:not([readonly]) { border-color: #38bdf8; }
        
        .btn-submit {
            width: 100%; padding: 12px; background: #ea580c; color: #ffffff;
            border: none; border-radius: 6px; font-weight: bold; font-size: 1rem;
            cursor: pointer; margin-top: 10px; transition: background 0.2s;
        }
        .btn-submit:hover { background: #c2410c; }
        .error-msg { color: #f87171; font-size: 0.85rem; margin-top: 15px; display: block; min-height: 20px; }

        /* Dashboard Layout */
        .dashboard-container { max-width: 1200px; margin: 0 auto; display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 25px; }
        .header h1 { color: #38bdf8; margin: 0; font-size: 1.6rem; }
        
        .panel { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .panel h3 { margin-top: 0; color: #f8fafc; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .inline-form { display: flex; gap: 10px; align-items: center; }
        .inline-form input { width: auto; flex: 1; }
        .status-msg { margin-top: 10px; font-size: 0.9rem; font-weight: bold; }

        /* Map Styling */
        #cbdMap {
            height: 480px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #334155;
            z-index: 1;
        }

        .legend-box {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            color: #cbd5e1;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .dot-rank { background: #38bdf8; box-shadow: 0 0 6px #38bdf8; }
        .dot-vehicle { background: #22c55e; box-shadow: 0 0 6px #22c55e; }

        /* Custom Leaflet Map Popup Styling */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #0f172a !important;
            color: #f8fafc !important;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <!-- Authentication Overlay -->
    <div id="loginModal" class="modal-overlay">
        <div class="login-card">
            <span class="badge">RESTRICT ACCESS</span>
            <h2>Administrator Login</h2>
            <p>City of Harare Central Operations</p>

            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" value="admin" readonly tabindex="-1">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn-submit">Authenticate Dashboard</button>
            </form>
            <span id="errorMessage" class="error-msg"></span>
        </div>
    </div>

    <!-- Main Protected Dashboard -->
    <div id="dashboardContent" class="dashboard-container">
        <div class="header">
            <h1>City of Harare CBD Fleet Control</h1>
            <span style="color: #4ade80; font-weight: bold;">● Telemetry Active</span>
        </div>

        <!-- Vehicle Registration Panel -->
        <div class="panel">
            <h3>+ Register Vehicle & Driver Access PIN</h3>
            <form id="registerForm" class="inline-form" autocomplete="off">
                <input type="text" id="regPlate" placeholder="Plate (e.g. AEB-9021)" required>
                <input type="text" id="regPin" placeholder="Driver Access PIN (e.g. 1234)" required>
                <button type="submit" class="btn-submit" style="width: auto; margin-top: 0; padding: 12px 24px;">Save & Generate PIN</button>
            </form>
            <div id="regStatus" class="status-msg"></div>
        </div>

        <!-- Interactive Map Panel -->
        <div class="panel">
            <h3>Harare CBD Live Telemetry & Legal Bus/Kombi Ranks</h3>
            <div class="legend-box">
                <div class="legend-item"><span class="dot dot-rank"></span> Legal Designated Rank</div>
                <div class="legend-item"><span class="dot dot-vehicle"></span> Active Vehicle (Live WebSocket)</div>
            </div>
            <div id="cbdMap"></div>
        </div>
    </div>

    <!-- Leaflet JS Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map;
        let vehicleMarkers = {};

        // Legal Harare CBD Bus/Taxi Ranks Coordinates
        const legalRanks = [
            { name: "Copacabana Bus Terminus", lat: -17.8315, lng: 31.0450, desc: "CBD West Commuter Hub" },
            { name: "Fourth Street Bus Terminus", lat: -17.8322, lng: 31.0565, desc: "CBD East Commuter Hub" },
            { name: "Market Square Bus Terminus", lat: -17.8358, lng: 31.0408, desc: "South-West Transit Hub" },
            { name: "Charge Office Bus Terminus", lat: -17.8340, lng: 31.0520, desc: "Central Commuter Hub" }
        ];

        // Ensure password field is blank on load
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('password').value = '';
        });

        // Initialize Map centered over Harare CBD
        function initMap() {
            map = L.map('cbdMap').setView([-17.8292, 31.0522], 14);

            // Dark Mode Tile Layer
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                maxZoom: 19
            }).addTo(map);

            // Add Legal Rank Markers
            legalRanks.forEach(rank => {
                const rankIcon = L.divIcon({
                    className: 'custom-rank-icon',
                    html: `<div style="background:#0284c7; color:#fff; border: 2px solid #38bdf8; border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:bold;">R</div>`,
                    iconSize: [22, 22]
                });

                L.marker([rank.lat, rank.lng], { icon: rankIcon })
                    .addTo(map)
                    .bindPopup(`<strong>${rank.name}</strong><br/>${rank.desc}`);
            });
        }

        // Establish WebSocket Connection for Live Fleet Updates
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'FLEET_UPDATE' && Array.isArray(data.vehicles)) {
                        updateVehicleMarkers(data.vehicles);
                    }
                } catch (e) {
                    console.error("Error parsing WebSocket telemetry stream:", e);
                }
            };

            ws.onclose = () => setTimeout(connectWebSocket, 3000);
        }

        // Update Dynamic Vehicle Markers on Map
        function updateVehicleMarkers(vehicles) {
            vehicles.forEach(([plate, info]) => {
                const { lat, lng, speed, timestamp } = info;

                const vehicleIcon = L.divIcon({
                    className: 'custom-vehicle-icon',
                    html: `<div style="background:#22c55e; color:#000; border: 2px solid #ffffff; border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-size:12px;">🚌</div>`,
                    iconSize: [24, 24]
                });

                if (vehicleMarkers[plate]) {
                    vehicleMarkers[plate].setLatLng([lat, lng]);
                    vehicleMarkers[plate].getPopup().setContent(`<strong>Plate: ${plate}</strong><br/>Speed: ${speed} km/h<br/>Last Ping: ${new Date(timestamp).toLocaleTimeString()}`);
                } else {
                    const marker = L.marker([lat, lng], { icon: vehicleIcon })
                        .addTo(map)
                        .bindPopup(`<strong>Plate: ${plate}</strong><br/>Speed: ${speed} km/h<br/>Last Ping: ${new Date(timestamp).toLocaleTimeString()}`);
                    vehicleMarkers[plate] = marker;
                }
            });
        }

        // Admin Authentication Request
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errSpan = document.getElementById('errorMessage');
            errSpan.innerText = '';

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    document.getElementById('loginModal').style.display = 'none';
                    document.getElementById('dashboardContent').style.display = 'block';
                    
                    // Initialize Map & WebSockets after login modal closes
                    initMap();
                    connectWebSocket();
                } else {
                    errSpan.innerText = data.message || 'Invalid admin credentials.';
                }
            } catch (err) {
                errSpan.innerText = 'Connection error. Check server status.';
            }
        });

        // Vehicle Registration Request
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusDiv = document.getElementById('regStatus');
            statusDiv.innerText = '';

            try {
                const response = await fetch('/api/admin/register-vehicle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        plate: document.getElementById('regPlate').value,
                        pin: document.getElementById('regPin').value
                    })
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    statusDiv.style.color = '#4ade80';
                    statusDiv.innerText = data.message;
                    document.getElementById('regPlate').value = '';
                    document.getElementById('regPin').value = '';
                } else {
                    statusDiv.style.color = '#f87171';
                    statusDiv.innerText = data.message || 'Registration failed.';
                }
            } catch (err) {
                statusDiv.style.color = '#f87171';
                statusDiv.innerText = 'Error registering vehicle.';
            }
        });
    </script>
</body>
</html>
