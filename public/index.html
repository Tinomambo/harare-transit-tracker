<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Operations - City of Harare Transit Tracker</title>
    <style>
        body { font-family: sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 20px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.95); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .modal-card { background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #38bdf8; width: 340px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; }
        button { width: 96%; padding: 12px; background: #ea580c; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #c2410c; }
        .error { color: #f87171; font-size: 0.85rem; margin-top: 10px; display: block; }
        .panel { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- Authentication Overlay -->
    <div id="loginModal" class="modal">
        <div class="modal-card">
            <h3>Administrator Login</h3>
            <p style="font-size: 0.8rem; color: #94a3b8;">City of Harare Central Operations</p>
            <form id="loginForm" autocomplete="off">
                <input type="text" id="username" placeholder="Username" autocomplete="off" required>
                <input type="password" id="password" name="admin_pass_field" placeholder="Password" autocomplete="new-password" required>
                <button type="submit">Authenticate Dashboard</button>
            </form>
            <span id="errorMessage" class="error"></span>
        </div>
    </div>

    <!-- Protected Admin Dashboard Content -->
    <div id="dashboardContent" style="display: none;">
        <h2>City of Harare Fleet Control Panel</h2>
        
        <div class="panel">
            <h3>Register Vehicle & Driver PIN</h3>
            <form id="registerForm" autocomplete="off">
                <input type="text" id="regPlate" placeholder="Registration Plate (e.g., AEB-9021)" required>
                <input type="password" id="regPin" placeholder="4-Digit Driver Access PIN" required>
                <button type="submit" style="width: auto; padding: 10px 20px;">Save Vehicle Registration</button>
            </form>
            <span id="regStatus" style="color: #4ade80; display: block; margin-top: 10px;"></span>
        </div>

        <div class="panel">
            <h3>Live Telemetry Feed</h3>
            <div id="telemetryData">Waiting for active driver streams...</div>
        </div>
    </div>

    <script>
        // Force input fields blank on load
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        });

        // Login Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errSpan = document.getElementById('errorMessage');
            errSpan.innerText = '';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    document.getElementById('loginModal').style.display = 'none';
                    document.getElementById('dashboardContent').style.display = 'block';
                } else {
                    errSpan.innerText = data.message || 'Authentication failed.';
                }
            } catch (err) {
                errSpan.innerText = 'Connection error. Ensure backend server is running.';
            }
        });

        // Vehicle Registration Handler
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/admin/register-vehicle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    plate: document.getElementById('regPlate').value,
                    pin: document.getElementById('regPin').value
                })
            });
            const data = await res.json();
            document.getElementById('regStatus').innerText = data.message;
        });
    </script>
</body>
</html>
