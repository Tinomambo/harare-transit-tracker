<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harare Transit Tracker - Vehicle Registration</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      margin-bottom: 20px;
      color: #38bdf8;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #94a3b8;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #334155;
      border-radius: 6px;
      background-color: #0f172a;
      color: #fff;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .format-hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #0369a1;
    }

    .alert {
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      display: none;
      font-size: 14px;
      text-align: center;
    }

    .alert-success {
      background-color: #065f46;
      color: #a7f3d0;
    }

    .alert-error {
      background-color: #991b1b;
      color: #fecaca;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Register Vehicle</h2>
    
    <form id="vehicleForm" novalidate>
      <div class="form-group">
        <label for="registration_number">Vehicle Registration Number *</label>
        <input 
          type="text" 
          id="registration_number" 
          name="registration_number" 
          placeholder="e.g. ABC-2009" 
          maxlength="8" 
          required
        />
        <div class="format-hint">Format must be strictly 3 letters, a hyphen, and 4 numbers (e.g. ABC-2009)</div>
      </div>

      <div class="form-group">
        <label for="capacity">Passenger Capacity</label>
        <input type="number" id="capacity" name="capacity" placeholder="e.g. 18" min="1" />
      </div>

      <div class="form-group">
        <label for="driver_name">Assigned Driver Name</label>
        <input type="text" id="driver_name" name="driver_name" placeholder="Driver Full Name" />
      </div>

      <button type="submit">Submit Registration</button>
    </form>

    <div id="alertBox" class="alert"></div>
  </div>

  <script>
    const form = document.getElementById('vehicleForm');
    const alertBox = document.getElementById('alertBox');
    const regInput = document.getElementById('registration_number');

    // Auto-uppercase input value dynamically as the user types
    regInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.toUpperCase();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Clear alert box
      alertBox.style.display = 'none';
      alertBox.className = 'alert';

      const registration_number = regInput.value.trim();
      const capacity = document.getElementById('capacity').value;
      const driver_name = document.getElementById('driver_name').value;

      // Frontend Regular Expression Validation
      const regPattern = /^[A-Z]{3}-\d{4}$/;

      if (!regPattern.test(registration_number)) {
        showAlert('Invalid Format! Registration must strictly follow ABC-2009 (e.g., ABC-2009).', 'error');
        return;
      }

      try {
        const response = await fetch('/api/vehicles', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            registration_number: registration_number,
            capacity: capacity ? parseInt(capacity) : null,
            driver_name: driver_name
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showAlert(data.message || 'Vehicle registered successfully!', 'success');
          form.reset();
        } else {
          showAlert(data.error || 'Failed to register vehicle.', 'error');
        }
      } catch (err) {
        console.error('Request failed:', err);
        showAlert('Unable to connect to the server. Please try again.', 'error');
      }
    });

    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
      alertBox.style.display = 'block';
    }
  </script>

</body>
</html>
