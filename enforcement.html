<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enforcement Verification - City of Harare</title>
    <style>
        body { font-family: sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 20px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.95); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .modal-card { background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #0284c7; width: 340px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; }
        button { width: 96%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .error { color: #f87171; font-size: 0.85rem; margin-top: 10px; display: block; }
        .result-card { padding: 20px; border-radius: 8px; margin-top: 20px; font-size: 1.1rem; }
        .status-green { background: #065f46; border: 1px solid #34d399; color: #a7f3d0; }
        .status-red { background: #991b1b; border: 1px solid #f87171; color: #fecaca; }
    </style>
</head>
<body>

    <!-- Authentication Overlay -->
    <div id="loginModal" class="modal">
        <div class="modal-card">
            <h3>Municipal Officer Login</h3>
            <p style="font-size: 0.8rem; color: #94a3b8;">Traffic Enforcement Verification Portal</p>
            <form id="officerLoginForm" autocomplete="off">
                <input type="text" id="officerUsername" placeholder="Officer ID / Username" autocomplete="off" required>
                <input type="password" id="officerPassword" name="officer_pass_field" placeholder="Password" autocomplete="new-password" required>
                <button type="submit">Access Verification Portal</button>
            </form>
            <span id="errorMessage" class="error"></span>
        </div>
    </div>

    <!-- Main Verification Screen -->
    <div id="enforcementContent" style="display: none;">
        <h2>Enforcement Verification Workflow (Process 4.0)</h2>
        <div style="background: #1e293b; padding: 20px; border-radius: 8px;">
            <h3>Lookup Vehicle Registration</h3>
            <form id="searchForm" autocomplete="off">
                <input type="text" id="searchPlate" placeholder="Enter Registration Plate (e.g., AEB-9021)" required style="width: 300px;">
                <button type="submit" style="width: auto; padding: 10px 20px;">Verify Permit Status</button>
            </form>

            <div id="resultBox" style="display: none;"></div>
        </div>
    </div>

    <script>
        // Force inputs clear on load
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('officerUsername').value = '';
            document.getElementById('officerPassword').value = '';
        });

        // Login Handler
        document.getElementById('officerLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errSpan = document.getElementById('errorMessage');
            errSpan.innerText = '';

            try {
                const res = await fetch('/api/officer/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('officerUsername').value,
                        password: document.getElementById('officerPassword').value
                    })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    document.getElementById('loginModal').style.display = 'none';
                    document.getElementById('enforcementContent').style.display = 'block';
                } else {
                    errSpan.innerText = data.message || 'Authentication failed.';
                }
            } catch (err) {
                errSpan.innerText = 'Connection error.';
            }
        });

        // Search Plate Handler
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const plate = document.getElementById('searchPlate').value;
            const res = await fetch('/api/enforcement/verify-plate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ plate })
            });
            const data = await res.json();

            const box = document.getElementById('resultBox');
            box.style.display = 'block';
            
            if (data.isRegistered && data.isBroadcasting) {
                box.className = 'result-card status-green';
                box.innerHTML = `<strong>PERMITTED OPERATOR</strong><br/>Plate: ${data.plate}<br/>Status: Authorized & Actively Transmitting Telemetry`;
            } else {
                box.className = 'result-card status-red';
                box.innerHTML = `<strong>UNREGISTERED / NON-COMPLIANT (MSHIKA-SHIKA)</strong><br/>Plate: ${data.plate}<br/>Registered: ${data.isRegistered ? 'YES' : 'NO'}<br/>Broadcasting: ${data.isBroadcasting ? 'YES' : 'NO'}`;
            }
        });
    </script>
</body>
</html>
